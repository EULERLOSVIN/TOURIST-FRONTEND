<div class="modal-backdrop-tingo" (click)="cerrar()">

    <div class="modal-box-tingo rounded-4 p-4 shadow-lg animate-slide-up" (click)="$event.stopPropagation()">

        <div class="modal-header-tingo d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-extrabold text-dark-green tracking-tight m-0">Editar Trabajador</h4>
                <!-- El nombre se lee directo del objeto dinámico inyectado -->
                <p class="text-secondary small m-0">Modifica los accesos, rol o datos de {{ trabajador?.name }}.</p>
            </div>
            <button (click)="cerrar()" class="btn-close-modal">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <form (submit)="$event.preventDefault()" class="d-flex flex-column gap-3">

            <div class="form-group">
                <label class="form-label text-secondary small fw-bold">Nombre Completo</label>
                <div class="input-group-tingo">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" [(ngModel)]="trabajadorEditado.name" name="name" class="form-control tingo-control">
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small fw-bold">DNI / Identificación</label>
                    <div class="input-group-tingo">
                        <i class="bi bi-card-heading"></i>
                        <input type="text" [(ngModel)]="trabajadorEditado.dni" name="dni" maxlength="8" class="form-control tingo-control">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small fw-bold">Rol Administrativo</label>
                    <!-- 🔄 Iteración dinámica de roles cargados de SQL Server -->
                    <select [(ngModel)]="trabajadorEditado.idRole" name="idRole" class="form-select tingo-select">
                        <option *ngFor="let r of roles" [value]="r.idRole">{{ r.roleName }}</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label text-secondary small fw-bold">Correo Institucional</label>
                <div class="input-group-tingo">
                    <i class="bi bi-envelope-at-fill"></i>
                    <input type="email" [(ngModel)]="trabajadorEditado.email" name="email" class="form-control tingo-control">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label text-secondary small fw-bold">Estado del Usuario</label>
                <!-- 🔄 Iteración dinámica de estados cargados de SQL Server -->
                <select [(ngModel)]="trabajadorEditado.idAccountState" name="idAccountState" class="form-select tingo-select">
                    <option *ngFor="let s of estados" [value]="s.idAccountState">{{ s.stateName }}</option>
                </select>
            </div>

            <div class="modal-footer-tingo d-flex gap-2 mt-3 pt-3 border-top">
                <button (click)="cerrar()" type="button"
                    class="btn btn-cancel-tingo rounded-pill px-4 py-2.5 fw-semibold flex-grow-1">
                    Cancelar
                </button>
                <button (click)="guardar()" type="submit"
                    class="btn btn-save-tingo rounded-pill px-4 py-2.5 fw-bold shadow-sm flex-grow-1 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-cloud-arrow-up-fill"></i> Guardar Cambios
                </button>
            </div>

        </form>

    </div>

</div>
