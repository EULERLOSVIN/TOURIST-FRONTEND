<div class="sidebar d-flex flex-column flex-shrink-0 p-3 h-100 shadow-lg">

  <div class="d-flex align-items-center mb-4 me-md-auto gap-2 px-2">
    <i class="bi bi-shield-check text-emerald fs-3"></i>
    <span class="fs-4 fw-bold text-white tracking-tight">TingoGo Admin</span>
  </div>

  <hr class="my-2 border-white opacity-10">

  <ul class="nav nav-pills flex-column mb-auto gap-1 mt-3">

    <li class="nav-item">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
        <i class="bi bi-speedometer2 me-3 fs-5"></i>
        <span class="fw-medium">Dashboard</span>
      </a>
    </li>

    <li>
      <a routerLink="/admin/workers" routerLinkActive="active" class="nav-link">
        <i class="bi bi-people me-3 fs-5"></i>
        <span class="fw-medium">Trabajadores</span>
      </a>
    </li>

    <li>
      <a routerLink="/admin/place" routerLinkActive="active" class="nav-link">
        <i class="bi bi-image me-3 fs-5"></i>
        <span class="fw-medium">Lugares</span>
      </a>
    </li>

    <li>
      <a routerLink="/admin/reviews" routerLinkActive="active" class="nav-link">
        <i class="bi bi-chat-square-heart me-3 fs-5"></i>
        <span class="fw-medium">Gestión de Reseñas</span>
      </a>
    </li>

    <li>
      <a routerLink="/admin/configuration" routerLinkActive="active" class="nav-link">
        <i class="bi bi-gear me-3 fs-5"></i>
        <span class="fw-medium">Configuración</span>
      </a>
    </li>

  </ul>

  <hr class="my-3 border-white opacity-10">

  <div class="sidebar-footer">
    <div class="d-flex align-items-center gap-3 px-2 mb-3">
      <div class="admin-avatar bg-glass-avatar text-white fw-bold rounded-circle d-flex align-items-center justify-content-center shadow-sm">
        A
      </div>
      <div class="admin-info overflow-hidden">
        <h6 class="m-0 fw-bold text-white text-truncate">Administrador</h6>
        <span class="text-white-50 small text-truncate d-block">admin&#64;tingogo.com</span>
      </div>
    </div>

    <button (click)="cerrarSesion()" class="btn btn-logout w-100 rounded-3 d-flex align-items-center justify-content-center gap-2 py-2 fw-semibold shadow-sm">
      <i class="bi bi-box-arrow-left fs-5"></i>
      Cerrar Sesión
    </button>
  </div>

</div>
